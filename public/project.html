<!doctype html><html><head><meta charset="utf-8"><title>QA — Run of show</title>
<style>
  body { background: #141414; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 32px; }
  h1 { font-weight: 600; font-size: 28px; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
  th { text-align: left; color: #888; font-weight: 500; padding: 8px 12px; border-bottom: 1px solid #333; }
  td { padding: 8px 12px; border-bottom: 1px solid #222; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #1c1c1c; }
  .badge { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .badge.ok { background: #14331f; color: #4ade80; }
  .badge.bad { background: #3a1717; color: #f87171; }
  a.ext { color: #60a5fa; text-decoration: none; }
</style></head><body>
<h1>Figma ↔ Video QA — run of show</h1>
<div id="table">Loading…</div>
<script>
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
fetch('/api/runs').then(r => r.json()).then(all => {
  const seen = new Set();
  const runs = all.filter(r => { const k = r.name ?? r.runId; if (seen.has(k)) return false; seen.add(k); return true; });
  if (!runs.length) { document.getElementById('table').textContent = 'No reports yet.'; return; }
  const link = (url, label) => url ? `<a class="ext" href="${url}" target="_blank" onclick="event.stopPropagation()">${label}</a>` : '<span style="color:#555">—</span>';
  document.getElementById('table').innerHTML = `<table><tr><th>Nr</th><th>Date</th><th>Demo name</th><th>Figma</th><th>Frame.io</th><th>Status</th></tr>` +
    runs.map((r, i) => {
      const s = r.summary ?? {};
      const ok = (s.mismatch ?? 0) === 0 && (s.missing ?? 0) === 0 && s.orderOk !== false;
      const date = r.date ? new Date(r.date).toLocaleDateString() : r.runId.slice(0, 10);
      return `<tr class="row" onclick="location.href='/report/${r.runId}'">
        <td>${i + 1}</td><td>${date}</td><td>${esc(r.name)}</td>
        <td>${link(r.figmaUrl, 'Figma')}</td><td>${link(r.frameioUrl, 'Video')}</td>
        <td><span class="badge ${ok ? 'ok' : 'bad'}">${ok ? 'Match' : (s.mismatch ?? 0) + ' mismatch' + ((s.missing ?? 0) ? ' · ' + s.missing + ' missing' : '')}</span></td>
      </tr>`;
    }).join('') + '</table>';
});
</script></body></html>
