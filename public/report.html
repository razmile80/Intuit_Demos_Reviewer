<!doctype html><html><head><meta charset="utf-8"><title>QA Report</title>
<style>
  body { background: #141414; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 32px; }
  h1 { font-weight: 600; font-size: 22px; }
  #summary { font-size: 22px; font-weight: 600; margin: 16px 0; }
  #strip { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 16px; }
  .col { min-width: 190px; text-align: center; cursor: pointer; }
  .col img { width: 180px; border-radius: 8px; display: block; margin: 0 auto 10px; }
  .verdict { font-weight: 700; margin-top: 6px; text-transform: capitalize; }
  .match { color: #4ade80; } .mismatch { color: #f87171; } .not_found, .error { color: #fbbf24; }
  .ghost { width: 180px; height: 320px; border: 2px dashed #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; margin: 0 auto 10px; }
  .meta { font-size: 11px; color: #888; }
  #detail { display: none; position: sticky; bottom: 0; background: #1c1c1c; border-top: 1px solid #333; padding: 14px; z-index: 20; }
  .dvp { flex: 1; height: 58vh; overflow: hidden; position: relative; background: #111; border-radius: 8px; cursor: grab; touch-action: none; }
  .zwrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zwrap img { display: block; user-select: none; pointer-events: none; }
  .boxlayer { position: absolute; inset: 0; pointer-events: none; }
  .annobox { position: absolute; border: 3px solid #ef4444; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,0.5); }
  .annobox.hot { border-color: #facc15; box-shadow: 0 0 12px rgba(250,204,21,0.7); }
  .annobox.manual { border-color: #fb923c; border-style: dashed; }
  .dvp.drawing { cursor: crosshair; }
  /* The column currently open in the detail panel */
  .col.active img { outline: 2px solid #236CFF; outline-offset: 2px; }
  .col.active .meta { color: #60a5fa; }
  /* Shrink the filmstrip while the detail panel is open so both fit on screen */
  body.detailopen .col { min-width: 110px; }
  body.detailopen .col img { width: 100px; }
  body.detailopen .col .ghost { width: 100px; height: 170px; font-size: 10px; }
  #detailNav button { background: #1e1e1e; border: 1px solid #444; color: #eee; border-radius: 6px; padding: 4px 14px; cursor: pointer; font-size: 13px; }
  #detailNav button:disabled { opacity: 0.35; cursor: default; }
  #dDiffs li.manualnote { color: #fdba74; }
  button.notebtn { background: #7c2d12; border: 1px solid #9a3412; color: #fed7aa; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  button.notebtn.active { background: #fb923c; color: #1c1917; font-weight: 600; }
  /* Condensed header: shrinks on scroll so the video and timeline get the room. */
  /* No transitions here on purpose: animating layout properties (font-size,
     padding) on a sticky element that overlaps transformed content makes
     Chrome leave a stale second copy painted behind it. Snap instead, and
     give the header its own compositing layer so it repaints cleanly. */
  #stickyHead { will-change: transform; transform: translateZ(0); backface-visibility: hidden; }
  #stickyHead.condensed { padding: 4px 0 4px; }
  #stickyHead.condensed h1 { font-size: 15px; margin: 0; }
  #stickyHead.condensed h1 button { padding: 3px 10px; font-size: 12px; }
  #stickyHead.condensed #backLink, #stickyHead.condensed #links { display: none; }
  #stickyHead.condensed #summary { font-size: 13px; color: #aaa; }
  .dvp .vtag { position: absolute; top: 6px; left: 6px; z-index: 2; background: rgba(0,0,0,0.6); color: #ccc; font-size: 9px; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.5px; }
  #detail ul { color: #f99; max-height: 10vh; overflow-y: auto; margin: 10px 0 0; }
  #dClose { position: absolute; top: 8px; right: 8px; z-index: 30; background: rgba(0,0,0,0.55); border: 0; color: #fff; font-size: 16px; cursor: pointer; border-radius: 999px; width: 30px; height: 30px; }
  .extra { opacity: 0.55; }
  button.share { padding: 8px 18px; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; color: #eee; cursor: pointer; }
  .thumb { z-index: 1; }
  .thumb:hover { z-index: 10; }
  .dismissBtn { display: none; background: #1e1e1e; border: 1px solid #444; color: #ccc; border-radius: 6px; padding: 2px 10px; font-size: 11px; cursor: pointer; margin-top: 4px; }
  .col:hover .dismissBtn { display: inline-block; }
  .dismissed-col { opacity: 0.55; }
</style></head><body>
<div id="headSentinel" style="height:1px;margin:-32px 0 0"></div>
<div id="stickyHead" style="position:sticky;top:0;z-index:15;background:#141414;padding:10px 0 8px;margin:0 0 8px;border-bottom:1px solid #262626">
<a href="/" id="backLink" style="color:#888;text-decoration:none;font-size:13px">← Run of show</a>
<h1 style="margin:6px 0 4px">Figma ↔ Video QA report <button class="share" id="share">Copy share link</button>
  <button class="share" id="rescanBtn" style="background:#236CFF;border-color:#236CFF;color:#fff;display:none" onclick="rescanHere()">Rescan</button>
  <span id="scanBadge" style="display:none;font-size:13px;font-weight:400;color:#888"><span class="spin" style="display:inline-block;width:12px;height:12px;border:2px solid #444;border-top-color:#236CFF;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px"></span> scanning…</span>
  <a id="newerLink" style="display:none;font-size:13px;color:#4ade80;margin-left:8px">Scan finished — view updated report →</a>
  <label id="deepWrap" style="display:none;font-size:13px;font-weight:400;color:#ccc;margin-left:10px;cursor:pointer" title="Sweeps each screen in overlapping bands — catches subtle artwork, icon and placeholder changes. Slower, but far more thorough."><input type="checkbox" id="deepScan" style="vertical-align:-2px"> deep scan</label>
</h1>
<div id="links" style="margin:4px 0 8px"></div>
<div id="summary" style="margin:0">Loading…</div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<div id="rescanLog" style="display:none;font:12px ui-monospace,monospace;color:#8a8;white-space:pre-wrap;max-height:120px;overflow-y:auto;background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:10px;margin-bottom:12px"></div>
<label id="extrasToggle" style="display:none;font-size:13px;color:#ccc;cursor:pointer;margin-right:16px"><input type="checkbox" id="showExtras" style="vertical-align:-2px"> <span id="extrasLabel">Extras</span></label>
<label id="dismissedToggle" style="display:none;font-size:13px;color:#ccc;cursor:pointer"><input type="checkbox" id="showDismissed" style="vertical-align:-2px"> <span id="dismissedLabel">Dismissed</span></label>
<div id="strip"></div>
<div id="detail"><button id="dClose" onclick="closeDetail()">✕</button>
  <div style="display:flex;gap:10px">
    <div class="dvp" id="dvpFigma" title="Scroll to zoom · drag to pan · double-click to fit"><span class="vtag">FIGMA</span><div class="zwrap"><img id="dFigma" draggable="false"><div class="boxlayer" id="dFigmaBoxes"></div></div></div>
    <div class="dvp" id="dvpVideo" title="Scroll to zoom · drag to pan · double-click to fit"><span class="vtag">VIDEO</span><div class="zwrap"><img id="dVideo" draggable="false"><div class="boxlayer" id="dVideoBoxes"></div></div></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
    <button class="notebtn" id="noteBtn" onclick="toggleDraw()">✎ Add note</button>
    <span id="noteHint" style="font-size:12px;color:#888"></span>
    <span id="detailNav" style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <button id="prevBtn" onclick="stepDetail(-1)">← Previous</button>
      <span id="detailPos" style="font-size:12px;color:#888"></span>
      <button id="nextBtn" onclick="stepDetail(1)">Next →</button>
    </span>
  </div>
  <ul id="dDiffs"></ul>
</div>
<div id="reviewer" style="display:none;margin-top:40px">
  <h2 style="font-weight:600;font-size:18px">Timeline review <span style="color:#888;font-size:13px;font-weight:400">— click a design to preview it; drag it onto the moment it belongs to and I'll re-judge it there</span>
    <label style="font-size:13px;font-weight:400;color:#ccc;margin-left:16px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="showMatches" checked style="vertical-align:-2px"> show matches</label>
    <label style="font-size:13px;font-weight:400;color:#ccc;margin-left:12px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="showDismissedTl" style="vertical-align:-2px"> dismissed</label>
  </h2>
  <div style="display:flex;gap:20px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div style="position:relative">
        <video id="vid" controls style="width:100%;border-radius:8px;background:#000;display:block"></video>
        <div id="vidBoxes" style="position:absolute;inset:0;pointer-events:none"></div>
        <div id="vidOverlay" style="display:none;position:absolute;inset:0;cursor:crosshair;background:rgba(251,146,60,0.06)"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <button class="notebtn" id="vidNoteBtn" onclick="toggleVideoDraw()">✎ Note on video</button>
        <span id="vidNoteHint" style="font-size:12px;color:#888"></span>
      </div>
      <ul id="vidNotes" style="list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:#fdba74"></ul>
      <div id="track" style="position:relative;height:92px;margin-top:12px;border-top:1px solid #333">
        <div id="playhead" style="position:absolute;top:0;width:2px;height:100%;background:#2563eb;pointer-events:none"></div>
      </div>
      <div id="rejudgeStatus" style="color:#fbbf24;font-size:13px;min-height:18px"></div>
    </div>
    <div id="divider" title="Drag to resize" style="display:none;width:6px;flex-shrink:0;cursor:col-resize;border-radius:3px;background:#2a2a2a;align-self:stretch"></div>
    <div id="preview" style="width:48%;flex-shrink:0;display:none;position:relative;border-radius:8px">
      <button onclick="document.getElementById('preview').style.display='none';document.getElementById('divider').style.display='none'"
        style="position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,0.55);border:0;color:#fff;font-size:16px;cursor:pointer;border-radius:999px;width:30px;height:30px">✕</button>
      <button onclick="document.getElementById('pvViewport').requestFullscreen()" title="Full screen"
        style="position:absolute;top:8px;right:44px;z-index:2;background:rgba(0,0,0,0.55);border:0;color:#fff;font-size:14px;cursor:pointer;border-radius:999px;width:30px;height:30px">⛶</button>
      <div id="pvViewport" title="Scroll to zoom · drag to pan · double-click to fit"
        style="width:100%;height:74vh;overflow:hidden;position:relative;background:#111;border-radius:8px;cursor:grab;touch-action:none">
        <div class="zwrap"><img id="pvImg" draggable="false"><div class="boxlayer" id="pvBoxes"></div></div>
      </div>
      <ul id="pvDiffs" style="color:#f99;font-size:12px;padding-left:18px;margin:10px 0 0"></ul>
    </div>
  </div>
</div>
<div id="vo" style="margin-top:40px;max-width:900px">
  <h2 style="font-weight:600;font-size:18px">VO / script <span id="voMeta" style="color:#888;font-size:13px;font-weight:400"></span></h2>
  <textarea id="voText" placeholder="Paste the latest script here…" style="width:100%;min-height:180px;background:#1e1e1e;color:#eee;border:1px solid #333;border-radius:8px;padding:12px;font-size:14px;line-height:1.5"></textarea><br>
  <button class="share" id="voSave" style="margin-top:8px">Compare with previous &amp; save</button>
  <pre id="voChanges" style="display:none;background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.6;color:#ddd"></pre>
</div>
<script>
const $ = id => document.getElementById(id);
const slugify = s => (s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
$('share').onclick = async () => {
  // Stable permalink: always resolves to this demo's latest report.
  const url = window._report?.name ? location.origin + '/demo/' + slugify(window._report.name) : location.href;
  await navigator.clipboard.writeText(url);
  $('share').textContent = 'Link copied ✓';
  setTimeout(() => $('share').textContent = 'Copy share link', 2000);
};
$('showExtras').onchange = () => window._report && render(window._report);
$('showDismissed').onchange = () => window._report && (render(window._report), placeThumbs(window._report));
// Condense on scroll via a sentinel ABOVE the header. Measuring scrollY here
// would oscillate: condensing shortens the page, which shifts scrollY back
// under the threshold, which expands it again (visible jitter). The sentinel's
// document position is unaffected by the header's own size, so no feedback loop.
// ESC closes whichever overlay is open: the side-by-side detail panel first,
// then the side preview. (Fullscreen viewers handle their own ESC.)
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName ?? '');
  // Space plays/pauses the video from anywhere on the page (default is scroll).
  if (e.code === 'Space' && !typing && $('vid')?.src) {
    e.preventDefault();
    $('vid').paused ? $('vid').play() : $('vid').pause();
    return;
  }
  // Arrow keys step through screens while the detail panel is open.
  if ($('detail').style.display === 'block' && !document.fullscreenElement
      && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')
      && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName ?? '')) {
    e.preventDefault();
    stepDetail(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key !== 'Escape' || document.fullscreenElement) return;
  if ($('detail').style.display === 'block') { closeDetail(); return; }
  if ($('preview').style.display === 'block') {
    $('preview').style.display = 'none';
    $('divider').style.display = 'none';
  }
});

new IntersectionObserver(
  ([e]) => $('stickyHead').classList.toggle('condensed', !e.isIntersecting),
  { threshold: 0 },
).observe($('headSentinel'));
const runId = location.pathname.split('/').pop();
fetch('/api/report/' + runId).then(r => r.json()).then(render).catch(() => $('summary').textContent = 'Report not found');

function render(r) {
  if (r.error) { $('summary').textContent = r.error; return; }
  const s = r.summary;
  document.title = 'QA · ' + (r.name ?? r.runId);
  document.querySelector('h1').firstChild.textContent = (r.name ?? 'Figma ↔ Video QA report') + ' ';
  const pencil = key => `<span onclick="editReportLink('${key}')" title="Edit link" style="cursor:pointer;color:#666;margin-right:16px">✎</span>`;
  const L = [];
  L.push((r.figmaUrl ? `<a href="${r.figmaUrl}" target="_blank" style="color:#60a5fa">Figma storyboard ↗</a>` : '<span style="color:#666">no Figma link</span>') + pencil('figmaUrl'));
  L.push((r.frameioUrl ? `<a href="${r.frameioUrl}" target="_blank" style="color:#60a5fa">Video ↗</a>` : '<span style="color:#666">no video link</span>') + pencil('frameioUrl'));
  if (r.date) L.push(`<span style="color:#888">${new Date(r.date).toLocaleString()}</span>`);
  $('links').innerHTML = L.join('');
  $('rescanBtn').style.display = (r.figmaUrl && r.frameioUrl) ? 'inline-block' : 'none';
  demoName = r.name ?? r.runId;
  loadScript();
  if (r.video) { buildTimeline(r); loadVideoNotes(); }
  if (r.script?.changes) {
    $('voChanges').style.display = 'block';
    $('voChanges').textContent = (r.script.source === 'transcript' ? '[auto-transcribed from video audio]\n\n' : '') + r.script.changes;
  }
  $('summary').textContent = s.live
    ? `scanning… ${r.screens.length}/${s.total} screens judged · ${s.match} match · ${s.mismatch} mismatch · ${s.missing} missing`
    : `${s.total} screens · ${s.match} match · ${s.mismatch} mismatch · ${s.missing} missing`
      + (s.errors ? ` · ${s.errors} errors` : '') + ` · order ${s.orderOk ? 'OK ✓' : 'BROKEN ✗'}`;
  const tag = label => `<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#ccc;font-size:9px;padding:1px 6px;border-radius:4px;letter-spacing:0.5px;text-transform:uppercase">${label}</span>`;
  const nDismissed = r.screens.filter(s => s.dismissed).length;
  if (nDismissed) {
    $('dismissedToggle').style.display = 'inline-block';
    $('dismissedLabel').textContent = `Dismissed (${nDismissed})`;
  } else $('dismissedToggle').style.display = 'none';
  $('strip').innerHTML = r.screens.map((sc, i) => sc.dismissed && !$('showDismissed').checked ? '' : `
    <div class="col ${sc.dismissed ? 'dismissed-col' : ''}" onclick="detail(${i})">
      <div style="position:relative">${tag('Figma')}<img src="${sc.figmaPng}" loading="lazy"></div>
      ${sc.videoPng ? `<div style="position:relative">${tag('Video')}<img src="${sc.videoPng}" loading="lazy"></div>` : '<div class="ghost">Not found</div>'}
      <div class="verdict ${sc.dismissed ? '' : sc.verdict}" ${sc.dismissed ? 'style="color:#888"' : ''}>${sc.dismissed ? 'dismissed' : sc.verdict.replace('_', ' ')}${sc.flagged ? ' ✎' : ''}</div>
      <div class="meta">${sc.name}${sc.timestamp !== null ? ' · ' + sc.timestamp.toFixed(1) + 's' : ''}</div>
      ${sc.verdict !== 'match' ? `<button class="dismissBtn" onclick="event.stopPropagation(); dismiss(${i}, ${!!sc.dismissed})">${sc.dismissed ? 'Restore' : 'Dismiss'}</button>` : ''}
    </div>`).join('') + ($('showExtras').checked ? r.extras.map(x => `
    <div class="col extra"><div class="ghost">no Figma source</div><div style="position:relative">${tag('Video')}<img src="${x.videoPng}" loading="lazy"></div><div class="verdict">extra</div><div class="meta">${x.timestamp.toFixed(1)}s</div></div>`).join('') : '');
  if (r.extras.length) {
    $('extrasToggle').style.display = 'inline-block';
    $('extrasLabel').textContent = `Extras (${r.extras.length})`;
  }
  window._report = r;
}

// ---- Timeline reviewer ----
const VCOL = { match: '#4ade80', mismatch: '#f87171', not_found: '#fbbf24', error: '#fbbf24' };
let dur = 60;
function buildTimeline(r) {
  $('reviewer').style.display = 'block';
  $('showMatches').onchange = () => placeThumbs(r);
  $('showDismissedTl').onchange = () => placeThumbs(r);
  const vid = $('vid');
  // Re-renders (e.g. after a re-judge) must not reload the video and lose the
  // playback position — only wire the player up once.
  if (vid.dataset.loaded) { placeThumbs(r); return; }
  vid.dataset.loaded = '1';
  vid.src = r.video;
  vid.addEventListener('loadedmetadata', () => {
    dur = vid.duration || 60;
    placeThumbs(r);
    // Always open in split view — a full-width video with no design beside it
    // isn't useful. Lead with the first thing needing attention.
    if (!$('preview').style.display || $('preview').style.display === 'none') {
      const first = r.screens.find(s => s.verdict === 'mismatch' && !s.dismissed)
        ?? r.screens.find(s => s.verdict !== 'match') ?? r.screens[0];
      if (first) preview(first);
    }
  });
  vid.addEventListener('timeupdate', () => {
    $('playhead').style.left = (vid.currentTime / dur * 100) + '%';
    drawVideoBoxes();
  });
  vid.addEventListener('seeked', drawVideoBoxes);
}
function placeThumbs(r) {
  const track = $('track');
  track.querySelectorAll('.thumb').forEach(el => el.remove());
  const showMatches = $('showMatches').checked;
  const showDismissedTl = $('showDismissedTl').checked;
  r.screens.forEach((sc, i) => {
    if (!showMatches && sc.verdict === 'match') return;
    if (sc.dismissed && !showDismissedTl) return;
    const el = document.createElement('div');
    el.className = 'thumb';
    el.style.cssText = 'position:absolute;top:8px;width:42px;cursor:grab;text-align:center;user-select:none';
    const t = sc.timestamp ?? (dur * i / r.screens.length);
    el.style.left = `calc(${Math.min(98, t / dur * 100)}% - 21px)`;
    const col = sc.dismissed ? '#888' : (VCOL[sc.verdict] ?? '#555');
    el.innerHTML = `<img src="${sc.figmaPng}" draggable="false" style="width:42px;height:56px;object-fit:cover;object-position:top center;border-radius:3px;border:2px solid ${col};display:block;background:#111${sc.dismissed ? ';opacity:0.55' : ''}">
      <div style="font-size:10px;color:${col}">${(sc.timestamp ?? '?')}s${sc.anchored ? ' 📌' : ''}</div>`;
    el.title = sc.name + ' — drag to re-anchor, click to seek';
    let startX = null, moved = false;
    el.addEventListener('pointerdown', e => { startX = e.clientX; moved = false; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (startX === null) return;
      if (Math.abs(e.clientX - startX) > 4) moved = true;
      if (!moved) return;
      const rect = track.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
      el.style.left = (x - 32) + 'px';
      $('vid').currentTime = x / rect.width * dur;
    });
    el.addEventListener('pointerup', async e => {
      const wasDrag = moved; startX = null; moved = false;
      const rect = track.getBoundingClientRect();
      if (!wasDrag) { $('vid').currentTime = (sc.timestamp ?? 0); preview(sc); return; }
      const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
      const ts = Math.round(x / rect.width * dur * 2) / 2;
      $('rejudgeStatus').textContent = `Re-judging "${sc.name}" at ${ts}s…`;
      const resp = await fetch('/api/rejudge', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId: window._report.runId, screenName: sc.name, timestamp: ts }) }).then(r => r.json());
      $('rejudgeStatus').textContent = resp.error ? ('❌ ' + resp.error) : `✓ ${sc.name} at ${ts}s: ${resp.screen.verdict}${resp.screen.differences.length ? ' — ' + dtext(resp.screen.differences[0]) : ''}`;
      if (!resp.error) {
        Object.assign(sc, resp.screen);
        Object.assign(window._report.summary, resp.summary);
        render(window._report);
        placeThumbs(window._report);
        if (window._previewName === sc.name) preview(sc); // refresh open preview with the new verdict
      }
    });
    track.appendChild(el);
  });
}

// Size the preview panel to the design's shape: portrait phone screens only
// claim the width they need, giving the video the rest. A manual drag of the
// divider overrides the auto-sizing for the rest of the session.
let userResized = false;
$('pvImg').addEventListener('load', () => {
  if (!userResized) {
    const ar = $('pvImg').naturalWidth / $('pvImg').naturalHeight;
    $('preview').style.width = ar < 1 ? `min(48%, calc(74vh * ${ar.toFixed(3)} + 10px))` : '48%';
  }
  requestAnimationFrame(fitImage);
});

// ---- Pan & zoom viewers: wheel = zoom at cursor, drag = pan, double-click
// = fit. The wheel is captured so the page never scrolls over a viewer. ----
function makeViewer(vp, img) {
  const wrap = img.parentElement; // .zwrap: image + annotation boxes move as one
  const st = { s: 1, tx: 0, ty: 0, fit: 1 };
  const apply = () => wrap.style.transform = `translate(${st.tx}px, ${st.ty}px) scale(${st.s})`;
  const fit = () => {
    if (!img.naturalWidth || !vp.clientWidth) return;
    wrap.style.width = img.naturalWidth + 'px';
    wrap.style.height = img.naturalHeight + 'px';
    st.fit = Math.min(vp.clientWidth / img.naturalWidth, vp.clientHeight / img.naturalHeight);
    st.s = st.fit;
    st.tx = (vp.clientWidth - img.naturalWidth * st.s) / 2;
    st.ty = (vp.clientHeight - img.naturalHeight * st.s) / 2;
    apply();
  };
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const ns = Math.min(Math.max(st.s * Math.exp(-e.deltaY * 0.0018), st.fit * 0.5), st.fit * 20);
    st.tx = mx - (mx - st.tx) * (ns / st.s);
    st.ty = my - (my - st.ty) * (ns / st.s);
    st.s = ns;
    apply();
  }, { passive: false });
  vp.addEventListener('pointerdown', e => {
    e.preventDefault();
    vp.setPointerCapture(e.pointerId);
    vp.style.cursor = 'grabbing';
    let lx = e.clientX, ly = e.clientY;
    const move = ev => { st.tx += ev.clientX - lx; st.ty += ev.clientY - ly; lx = ev.clientX; ly = ev.clientY; apply(); };
    const up = () => { vp.style.cursor = 'grab'; vp.removeEventListener('pointermove', move); vp.removeEventListener('pointerup', up); };
    vp.addEventListener('pointermove', move);
    vp.addEventListener('pointerup', up);
  });
  vp.addEventListener('dblclick', fit);
  img.addEventListener('load', () => requestAnimationFrame(fit));
  return { fit };
}
const pvViewer = makeViewer($('pvViewport'), $('pvImg'));
const dvFigma = makeViewer($('dvpFigma'), $('dFigma'));
const dvVideo = makeViewer($('dvpVideo'), $('dVideo'));
function fitImage() { pvViewer.fit(); }

// Red annotation boxes over the images, at the judge's coordinates (% of image).
const dtext = d => d?.text ?? d;
function setBoxes(layerId, diffs, key) {
  const scale = b => Math.min(b, 100);
  $(layerId).innerHTML = (diffs ?? []).map((d, i) => {
    const b = typeof d === 'object' ? d[key] : null;
    if (!b || b.x == null) return '';
    return `<div class="annobox${d.manual ? ' manual' : ''}" data-i="${i}" style="left:${scale(b.x)}%;top:${scale(b.y)}%;width:${Math.max(b.w ?? 2, 1.5)}%;height:${Math.max(b.h ?? 2, 1)}%"></div>`;
  }).join('');
}
function wireDiffHover(listEl, layerIds) {
  listEl.querySelectorAll('li').forEach(li => {
    const i = li.dataset.i;
    li.addEventListener('mouseenter', () => layerIds.forEach(id => $(id).querySelectorAll(`.annobox[data-i="${i}"]`).forEach(b => b.classList.add('hot'))));
    li.addEventListener('mouseleave', () => layerIds.forEach(id => $(id).querySelectorAll('.annobox').forEach(b => b.classList.remove('hot'))));
  });
}

// Drag the divider: left = bigger preview, right = bigger video.
const divider = $('divider');
divider.addEventListener('pointerdown', e => {
  e.preventDefault();
  divider.setPointerCapture(e.pointerId);
  const container = divider.parentElement.getBoundingClientRect();
  const move = ev => {
    const w = Math.min(Math.max(container.right - ev.clientX, 160), container.width - 320);
    $('preview').style.width = w + 'px';
    userResized = true;
  };
  const up = () => { divider.removeEventListener('pointermove', move); divider.removeEventListener('pointerup', up); fitImage(); };
  divider.addEventListener('pointermove', move);
  divider.addEventListener('pointerup', up);
});

async function editReportLink(key) {
  const r = window._report;
  const label = key === 'figmaUrl' ? 'Figma storyboard link' : 'Frame.io / Dropbox video link';
  const url = prompt(label + ':', r[key] ?? '');
  if (!url || url === r[key]) return;
  const resp = await fetch('/api/report/' + r.runId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [key]: url }) }).then(x => x.json());
  if (resp.error) return alert(resp.error);
  r.figmaUrl = resp.figmaUrl; r.frameioUrl = resp.frameioUrl;
  render(r);
}

// Live filmstrip: as the scan judges each screen, its column appears in the
// report immediately instead of everything landing at once.
let liveScreens = null;
function attachLive(es) {
  es.addEventListener('screen', e => {
    const sc = JSON.parse(e.data);
    liveScreens = liveScreens ?? [];
    liveScreens[sc.index] = sc;
    const screens = liveScreens.filter(Boolean);
    const partial = {
      ...window._report, screens, extras: [],
      summary: {
        total: sc.total, live: true,
        match: screens.filter(s => s.verdict === 'match').length,
        mismatch: screens.filter(s => s.verdict === 'mismatch' && !s.dismissed).length,
        missing: screens.filter(s => s.verdict === 'not_found').length,
        orderOk: true,
      },
    };
    render(partial);
    placeThumbs(partial);
  });
  es.addEventListener('done', e => { es.close(); location.href = '/report/' + JSON.parse(e.data).runId; });
}

async function rescanHere() {
  const r = window._report;
  if (!confirm(`Rescan "${r.name}" with the current links? Takes a few minutes.`)) return;
  $('rescanBtn').disabled = true; $('rescanBtn').textContent = 'Scanning…';
  $('rescanLog').style.display = 'block'; $('rescanLog').textContent = '';
  const resp = await fetch('/api/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ figmaUrl: r.figmaUrl, frameioUrl: r.frameioUrl, demoName: r.name, deep: $('deepScan').checked }) }).then(x => x.json());
  if (resp.error) { $('rescanLog').textContent = resp.error; $('rescanBtn').disabled = false; $('rescanBtn').textContent = 'Rescan'; return; }
  const es = new EventSource('/api/progress/' + resp.runId);
  window._liveES = es;
  es.addEventListener('progress', e => { $('rescanLog').textContent += JSON.parse(e.data) + '\n'; $('rescanLog').scrollTop = 1e9; });
  es.addEventListener('fail', e => {
    $('rescanLog').textContent += '❌ ' + JSON.parse(e.data).message + '\n';
    es.close(); window._liveES = null; $('rescanBtn').disabled = false; $('rescanBtn').textContent = 'Rescan';
  });
  attachLive(es);
}

// ---- Manual annotations: drag a box on either image, then type the note ----
let drawMode = false;
function toggleDraw() {
  drawMode = !drawMode;
  $('noteBtn').classList.toggle('active', drawMode);
  $('noteBtn').textContent = drawMode ? '✎ Drawing — drag a box' : '✎ Add note';
  $('noteHint').textContent = drawMode ? 'Drag across the area on either image, then type your note.' : '';
  ['dvpFigma', 'dvpVideo'].forEach(id => $(id).classList.toggle('drawing', drawMode));
}
function wireDrawing(vpId, side) {
  const vp = $(vpId);
  vp.addEventListener('pointerdown', e => {
    if (!drawMode) return;
    e.stopPropagation(); e.preventDefault();
    const img = vp.querySelector('img');
    const r = img.getBoundingClientRect();
    const start = { x: e.clientX, y: e.clientY };
    const ghost = document.createElement('div');
    ghost.className = 'annobox manual';
    ghost.style.position = 'fixed';
    ghost.style.zIndex = 40;
    document.body.appendChild(ghost);
    const move = ev => {
      const x = Math.min(start.x, ev.clientX), y = Math.min(start.y, ev.clientY);
      Object.assign(ghost.style, { left: x + 'px', top: y + 'px', width: Math.abs(ev.clientX - start.x) + 'px', height: Math.abs(ev.clientY - start.y) + 'px' });
    };
    const up = async ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up);
      ghost.remove();
      const box = {
        x: (Math.min(start.x, ev.clientX) - r.left) / r.width * 100,
        y: (Math.min(start.y, ev.clientY) - r.top) / r.height * 100,
        w: Math.abs(ev.clientX - start.x) / r.width * 100,
        h: Math.abs(ev.clientY - start.y) / r.height * 100,
      };
      if (box.w < 0.5 || box.h < 0.5) return; // ignore stray clicks
      const text = prompt('Note for this area:');
      if (!text) return;
      const sc = window._report.screens[window._detailIndex];
      const resp = await fetch('/api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId: window._report.runId, screenIndex: window._detailIndex, screenName: sc.name, side, box, text }) }).then(x => x.json());
      if (resp.error) return alert(resp.error);
      Object.assign(sc, resp.screen);
      Object.assign(window._report.summary, resp.summary);
      toggleDraw();
      const idx = window._detailIndex;
      render(window._report); placeThumbs(window._report); detail(idx);
      // Bring the annotated column into view so the note is obviously attached.
      $('strip').children[idx]?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
  }, true);
}
wireDrawing('dvpFigma', 'figma');
wireDrawing('dvpVideo', 'video');

async function removeNote(noteIndex) {
  const sc = window._report.screens[window._detailIndex];
  const resp = await fetch('/api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ runId: window._report.runId, screenIndex: window._detailIndex, screenName: sc.name, remove: noteIndex }) }).then(x => x.json());
  if (resp.error) return alert(resp.error);
  Object.assign(sc, resp.screen);
  Object.assign(window._report.summary, resp.summary);
  render(window._report); placeThumbs(window._report); detail(window._detailIndex);
}

async function dismiss(i, undo) {
  const sc = window._report.screens[i];
  const r = await fetch('/api/dismiss', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ runId: window._report.runId, screenName: sc.name, undo }) }).then(r => r.json());
  if (r.error) return alert(r.error);
  Object.assign(sc, r.screen);
  Object.assign(window._report.summary, r.summary);
  render(window._report);
  placeThumbs(window._report);
}

// ---- Notes anchored to the video timeline (shots with no Figma counterpart) ----
let vidDraw = false, videoNotes = [];
function toggleVideoDraw() {
  vidDraw = !vidDraw;
  $('vid').pause();
  $('vidOverlay').style.display = vidDraw ? 'block' : 'none';
  $('vidNoteBtn').classList.toggle('active', vidDraw);
  $('vidNoteBtn').textContent = vidDraw ? '✎ Drag a box on the video' : '✎ Note on video';
  $('vidNoteHint').textContent = vidDraw ? `Note will be pinned at ${fmt($('vid').currentTime)}` : '';
}
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

$('vidOverlay').addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = $('vidOverlay').getBoundingClientRect();
  const start = { x: e.clientX, y: e.clientY };
  const ghost = document.createElement('div');
  ghost.className = 'annobox manual';
  ghost.style.cssText = 'position:fixed;z-index:40';
  document.body.appendChild(ghost);
  const move = ev => Object.assign(ghost.style, {
    left: Math.min(start.x, ev.clientX) + 'px', top: Math.min(start.y, ev.clientY) + 'px',
    width: Math.abs(ev.clientX - start.x) + 'px', height: Math.abs(ev.clientY - start.y) + 'px',
  });
  const up = async ev => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    ghost.remove();
    const box = {
      x: (Math.min(start.x, ev.clientX) - r.left) / r.width * 100,
      y: (Math.min(start.y, ev.clientY) - r.top) / r.height * 100,
      w: Math.abs(ev.clientX - start.x) / r.width * 100,
      h: Math.abs(ev.clientY - start.y) / r.height * 100,
    };
    if (box.w < 1 || box.h < 1) return;
    const text = prompt(`Note at ${fmt($('vid').currentTime)}:`);
    if (!text) return;
    const resp = await fetch('/api/video-note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ demoName, t: $('vid').currentTime, box, text }) }).then(x => x.json());
    if (resp.error) return alert(resp.error);
    videoNotes = resp.notes;
    toggleVideoDraw();
    renderVideoNotes();
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
});

// Show a note's box whenever the playhead sits near its timestamp.
const NOTE_WINDOW = 1.5;
function drawVideoBoxes() {
  const t = $('vid').currentTime;
  $('vidBoxes').innerHTML = videoNotes
    .filter(n => Math.abs(n.t - t) <= NOTE_WINDOW && n.box)
    .map(n => `<div class="annobox manual" style="left:${n.box.x}%;top:${n.box.y}%;width:${n.box.w}%;height:${n.box.h}%">
        <span style="position:absolute;top:-20px;left:0;background:#fb923c;color:#1c1917;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap">${n.text}</span>
      </div>`).join('');
}

function renderVideoNotes() {
  drawVideoBoxes();
  $('vidNotes').innerHTML = videoNotes.map((n, i) =>
    `<li style="padding:2px 0">✎ <a onclick="document.getElementById('vid').currentTime=${n.t}" style="color:#60a5fa;cursor:pointer">${fmt(n.t)}</a> — ${n.text}
     <span onclick="removeVideoNote(${i})" style="cursor:pointer;color:#888;margin-left:6px" title="Delete">✕</span></li>`).join('');
  // Markers on the timeline track.
  $('track').querySelectorAll('.vidmark').forEach(el => el.remove());
  videoNotes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'vidmark';
    el.title = n.text;
    el.style.cssText = `position:absolute;bottom:0;left:${Math.min(99, n.t / dur * 100)}%;width:2px;height:22px;background:#fb923c`;
    el.onclick = () => { $('vid').currentTime = n.t; };
    $('track').appendChild(el);
  });
}
async function removeVideoNote(i) {
  const resp = await fetch('/api/video-note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ demoName, remove: i }) }).then(x => x.json());
  if (resp.error) return alert(resp.error);
  videoNotes = resp.notes;
  renderVideoNotes();
}
async function loadVideoNotes() {
  if (!demoName) return;
  videoNotes = await fetch('/api/video-notes?name=' + encodeURIComponent(demoName)).then(r => r.json()).catch(() => []);
  renderVideoNotes();
}

function preview(sc) {
  window._previewName = sc.name;
  $('preview').style.display = 'block';
  $('divider').style.display = 'block';
  $('pvImg').src = sc.figmaPng;
  $('pvDiffs').innerHTML = sc.differences.map((d, j) => `<li data-i="${j}">${dtext(d)}</li>`).join('');
  setBoxes('pvBoxes', sc.differences, 'figmaBox');
  wireDiffHover($('pvDiffs'), ['pvBoxes']);
}

// Reflect server-side scans of THIS demo (started by anyone, from anywhere).
let wasScanning = false;
async function pollActiveHere() {
  if (!demoName) return setTimeout(pollActiveHere, 3000);
  const active = await fetch('/api/active').then(r => r.json()).catch(() => []);
  const mine = active.find(a => a.demoName === demoName);
  const scanning = !!mine;
  // Passive viewers get the live filmstrip too.
  if (mine && !window._liveES) {
    const es = new EventSource('/api/progress/' + mine.runId);
    window._liveES = es;
    es.addEventListener('fail', () => { es.close(); window._liveES = null; });
    attachLive(es);
  }
  $('scanBadge').style.display = scanning ? 'inline-block' : 'none';
  const canRescan = !scanning && window._report?.figmaUrl && window._report?.frameioUrl;
  $('rescanBtn').style.display = canRescan ? 'inline-block' : 'none';
  $('deepWrap').style.display = canRescan ? 'inline-block' : 'none';
  if (wasScanning && !scanning) {
    // A scan just finished — link to the fresh report if it's a newer run.
    const runs = await fetch('/api/runs').then(r => r.json()).catch(() => []);
    const latest = runs.find(r => r.name === demoName);
    if (latest && latest.runId !== window._report.runId) {
      $('newerLink').href = '/report/' + latest.runId;
      $('newerLink').style.display = 'inline';
    }
  }
  wasScanning = scanning;
  if (scanning) setTimeout(pollActiveHere, 4000);
  else setTimeout(pollActiveHere, 15000);
}

let demoName = null;
setTimeout(pollActiveHere, 1500);
function loadScript() {
  if (!demoName) return;
  fetch('/api/script?name=' + encodeURIComponent(demoName)).then(r => r.json()).then(s => {
    if (s.latest) {
      $('voText').value = s.latest.text;
      $('voMeta').textContent = `v${s.versions.length} · ${new Date(s.latest.date).toLocaleString()}`;
    } else {
      $('voMeta').textContent = 'no script stored yet';
    }
  });
}
$('voSave').onclick = async () => {
  const text = $('voText').value.trim();
  if (!text || !demoName) return;
  $('voSave').disabled = true; $('voSave').textContent = 'Comparing…';
  const r = await fetch('/api/script', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: demoName, text }) }).then(r => r.json());
  $('voSave').disabled = false; $('voSave').textContent = 'Compare with previous & save';
  $('voChanges').style.display = 'block';
  $('voChanges').textContent = r.error ?? r.changes;
  if (!r.error && !r.unchanged) $('voMeta').textContent = `v${r.version} · just now`;
};

function detail(i) {
  const sc = window._report.screens[i];
  $('dFigma').src = sc.figmaPng;
  $('dvpVideo').style.display = sc.videoPng ? '' : 'none';
  if (sc.videoPng) $('dVideo').src = sc.videoPng;
  window._detailIndex = i;
  $('dDiffs').innerHTML = sc.differences.map((d, j) => d.manual
    ? `<li data-i="${j}" class="manualnote">✎ ${dtext(d)} <span onclick="removeNote(${d.noteIndex})" style="cursor:pointer;color:#888;margin-left:6px" title="Delete note">✕</span></li>`
    : `<li data-i="${j}">${dtext(d)}</li>`).join('') || '<li style="color:#4ade80">No differences found</li>';
  setBoxes('dFigmaBoxes', sc.differences, 'figmaBox');
  setBoxes('dVideoBoxes', sc.differences, 'videoBox');
  wireDiffHover($('dDiffs'), ['dFigmaBoxes', 'dVideoBoxes']);
  $('detail').style.display = 'block';
  document.body.classList.add('detailopen');
  // Highlight the open column and keep it in view.
  [...$('strip').children].forEach((el, j) => el.classList.toggle('active', j === i));
  $('strip').children[i]?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  const visible = [...$('strip').children].filter(el => el.classList.contains('col') && !el.classList.contains('extra'));
  $('prevBtn').disabled = i <= 0;
  $('nextBtn').disabled = i >= window._report.screens.length - 1;
  $('detailPos').textContent = `${i + 1} / ${window._report.screens.length}`;
  requestAnimationFrame(() => { dvFigma.fit(); dvVideo.fit(); });
}

function closeDetail() {
  $('detail').style.display = 'none';
  document.body.classList.remove('detailopen');
  [...$('strip').children].forEach(el => el.classList.remove('active'));
}

function stepDetail(delta) {
  const next = (window._detailIndex ?? 0) + delta;
  if (next >= 0 && next < window._report.screens.length) detail(next);
}
